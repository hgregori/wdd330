<!-- PokéSphere Header Partial -->
<!-- Injected into #header-placeholder by src/js/components/partials.js -->
<header class="site-header" role="banner">
  <div class="header-inner">

    <!-- Logo / Brand -->
    <a href="#home" class="header-logo" aria-label="PokéSphere Home">
      <span class="logo-icon" aria-hidden="true">&#9670;</span>
      <span class="logo-text">Poké<span class="logo-accent">Sphere</span></span>
    </a>

    <!-- Global Search Bar -->
    <form class="header-search" role="search" id="header-search-form">
      <label for="header-search-input" class="sr-only">Search Pokémon</label>
      <input
        type="search"
        id="header-search-input"
        class="header-search__input"
        placeholder="Search Pokémon…"
        autocomplete="off"
        aria-label="Search Pokémon by name or number"
        minlength="1"
        maxlength="60"
      />
      <button type="submit" class="header-search__btn" aria-label="Submit search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <!-- Recent search suggestions (populated by JS) -->
      <ul class="header-search__suggestions" id="search-suggestions" role="listbox" aria-label="Recent searches" hidden></ul>
    </form>

    <!-- Hamburger (mobile only) -->
    <button class="nav-toggle" id="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

  </div><!-- /.header-inner -->

  <!-- Primary Navigation -->
  <nav class="main-nav" id="main-nav" role="navigation" aria-label="Main navigation">
    <ul class="nav-list" role="list">
      <li class="nav-item">
        <a href="#home" class="nav-link" data-route="home" aria-label="Go to Home">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Home
        </a>
      </li>
      <li class="nav-item">
        <a href="#search" class="nav-link" data-route="search" aria-label="Go to Pokémon Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Search
        </a>
      </li>
      <li class="nav-item">
        <a href="#calculator" class="nav-link" data-route="calculator" aria-label="Go to Stat Calculator">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="8" y1="10" x2="16" y2="10"></line>
            <line x1="8" y1="14" x2="12" y2="14"></line>
          </svg>
          Calculator
        </a>
      </li>
      <li class="nav-item">
        <a href="#team" class="nav-link" data-route="team" aria-label="Go to Team Builder">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Team Builder
        </a>
      </li>
      <li class="nav-item">
        <a href="#favorites" class="nav-link" data-route="favorites" aria-label="Go to Favorites">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          Favorites
        </a>
      </li>
      <li class="nav-item">
        <a href="#locations" class="nav-link" data-route="locations" aria-label="Go to Locations and Maps">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
          Locations
        </a>
      </li>
    </ul>
  </nav><!-- /.main-nav -->

</header><!-- /.site-header -->
